<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social UI - Login</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html">Social App</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="feed/index.html">Feed</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile/index.html">Profile</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
          <h1>Log in</h1>
          <div class="card p-4">
            <form action="/profile" method="get" class="mt-3">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  required
                  name="email"
                />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  minlength="8"
                  required
                  name="password"
                />
              </div>
              <div class="text-center mt-3">
              <button type="submit" class="btn btn-primary px-5">Log in</button>
            </div>
            </form>
            <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
